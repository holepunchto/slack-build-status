name: Slack Build Status — Create
description: Post an initial build status message to Slack

inputs:
  token:
    description: Slack Bot OAuth token (e.g. "xoxb-1234567890-1234567890123-abc")
    required: true
  channel-id:
    description: Slack channel ID to post to (e.g. "C0123456789")
    required: true
  builds:
    description: >
      JSON array of builds. Each object: { name, label, group, status?, link? }
      Example: [{"name":"apk","label":"APK","group":"Android","status":"running"}]
    required: true
  version:
    description: Build version string (e.g. "1.2.3")
    required: true
  branch:
    description: Git branch name (e.g. "main"). Omit to leave it out of the header entirely.
    required: false
  git-url:
    description: URL to the git commit/branch (e.g. "https://github.com/owner/repo/tree/main")
    required: true
  changelog-from:
    description: Git ref to generate changelog from (e.g. "v1.0.0"). Auto-generates changelog and compare URL.
    required: false
  changelog:
    description: 'Manual changelog text, overrides changelog-from (#N and (#N) references are auto-linked to GitHub PRs)'
    required: false
  changelog-compare-url:
    description: 'Manual compare URL, overrides auto-generated one (e.g. "https://github.com/owner/repo/compare/v1.0.0...v1.1.0")'
    required: false
  changelog-in-thread:
    description: 'Post the changelog as a thread reply instead of in the message body (e.g. "true")'
    required: false
    default: 'false'
  icon:
    description: Icon emoji/text to prepend to header (e.g. app icon)
    required: false
  extra-badges:
    description: Additional badge emojis for the header (e.g. ":badge-staging:")
    required: false
  show-status:
    description: 'Render per-build status emojis (live status board). When "false", lists build labels only — a static announcement with no updates.'
    required: false
    default: 'true'
  thread-replies:
    description: 'JSON array of thread replies: [{"text":"..."}]'
    required: false
  notify-users:
    description: Slack user mentions to CC in thread (e.g. "<@U123> <@U456>")
    required: false
  repo:
    description: GitHub repo (owner/name) for PR link detection. Defaults to current repo. (e.g. "owner/repo")
    required: false
  github-token:
    description: 'GitHub token for fetching PR descriptions (e.g. "ghp_xxx"). Defaults to github.token.'
    required: false
    default: ${{ github.token }}

outputs:
  ts:
    description: Slack message timestamp (used to update the message later)

runs:
  using: node24
  main: ../dist/create/index.js
