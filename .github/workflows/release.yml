name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump to apply
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: exact version to release, overriding bump (e.g. 1.4.0)
        type: string
        required: false

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Resolve the target version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          current="${latest#v}"
          [ -n "$current" ] || current=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ]; then
            target="${VERSION#v}"
          else
            IFS=. read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            target="${major}.${minor}.${patch}"
          fi
          if git rev-parse -q --verify "refs/tags/v${target}" > /dev/null; then
            echo "v${target} is already tagged" >&2
            exit 1
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Push the build to v1 and tag it
        id: publish
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          npm version "$TARGET" --no-git-tag-version --allow-same-version > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit onto the tip of v1 rather than resetting the branch to main:
          # the index still holds main's tree, so the new commit carries main's
          # content with the previous release as its parent. Resetting would
          # leave every earlier release commit on no branch at all.
          git fetch origin "+refs/heads/v1:refs/heads/v1" || true
          if git rev-parse -q --verify refs/heads/v1 > /dev/null; then
            git symbolic-ref HEAD refs/heads/v1
          else
            git checkout -B v1
          fi
          git add -f dist/ package.json
          git commit -m "chore(release): v${TARGET} (from ${GITHUB_SHA:0:7})"
          git tag "v${TARGET}"
          git push origin "refs/tags/v${TARGET}"
          git push origin "HEAD:refs/heads/v1"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          TARGET: ${{ steps.target.outputs.target }}
          SHA: ${{ steps.publish.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${TARGET}" --target "$SHA" --title "v${TARGET}" --generate-notes
          {
            printf 'Released **v%s**\n\n' "$TARGET"
            printf 'Pin callers at:\n\n```yaml\nuses: holepunchto/slack-build-status/create@%s # v%s\n```\n' "$SHA" "$TARGET"
          } >> "$GITHUB_STEP_SUMMARY"
