name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump to apply
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: exact version to release, overriding bump (e.g. 1.4.0)
        type: string
        required: false

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Resolve the target version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          current="${latest#v}"
          [ -n "$current" ] || current=$(node -p "require('./package.json').version")
          if [ -n "$VERSION" ]; then
            target="${VERSION#v}"
          else
            IFS=. read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            target="${major}.${minor}.${patch}"
          fi
          if git rev-parse -q --verify "refs/tags/v${target}" > /dev/null; then
            echo "v${target} is already tagged" >&2
            exit 1
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"

      - name: Push the build to v1 and tag it
        id: publish
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          npm version "$TARGET" --no-git-tag-version --allow-same-version > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/v1:refs/heads/v1" || true
          git add -f dist/ package.json
          tree=$(git write-tree)
          # Two parents on purpose. First is the previous release, so v1 advances
          # by fast-forward and every tagged release keeps belonging to it -
          # resetting the branch to main would leave earlier releases on no branch
          # at all. Second is the commit being released, so `v(N-1)..vN` spans what
          # landed on main and the generated notes list it.
          if git rev-parse -q --verify refs/heads/v1 > /dev/null; then
            parents=(-p refs/heads/v1 -p "$GITHUB_SHA")
          else
            parents=(-p "$GITHUB_SHA")
          fi
          commit=$(git commit-tree "$tree" "${parents[@]}" -m "chore(release): v${TARGET} (from ${GITHUB_SHA:0:7})")
          git update-ref refs/heads/v1 "$commit"
          git tag "v${TARGET}" "$commit"
          git push origin "refs/tags/v${TARGET}"
          git push origin refs/heads/v1
          echo "sha=${commit}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          TARGET: ${{ steps.target.outputs.target }}
          SHA: ${{ steps.publish.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${TARGET}" --target "$SHA" --title "v${TARGET}" --generate-notes
          {
            printf 'Released **v%s**\n\n' "$TARGET"
            printf 'Pin callers at:\n\n```yaml\nuses: holepunchto/slack-build-status/create@%s # v%s\n```\n' "$SHA" "$TARGET"
          } >> "$GITHUB_STEP_SUMMARY"
